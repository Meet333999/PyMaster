<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PyMaster — Technical Hardware Console & Learning Environment</title>
  <meta name="description" content="Technical programming console for Python, SQL, and Data Structures. Interactive code execution with dual-mode hardware skeuomorphism." />

  <!-- Prevent Theme Flash -->
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('pymaster_theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Monaco Editor -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>

  <!-- Pyodide (Python runtime) -->
  <script defer src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>

  <!-- sql.js (SQLite runtime) -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>

  <!-- App CSS -->
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app" class="app-container">
    <!-- Mobile Sidebar Backdrop Overlay -->
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- Left Hardware Strip -->
    <aside id="sidebar" class="sidebar"></aside>

    <!-- Top Hardware Header Deck -->
    <header id="topbar" class="topbar"></header>

    <!-- Main Workspace Chassis -->
    <main id="main-content" class="main-content">
      <!-- Simple Black & White Lottie Loading Animation -->
      <div class="loading-screen" id="loading-screen">
        <div class="loading-content-lottie">
          <div class="lottie-player-wrapper" id="lottie-loader"></div>
        </div>
      </div>
    </main>

    <!-- Mobile Bottom Navigation Dock -->
    <nav class="mobile-bottom-nav" id="mobile-bottom-nav"></nav>

    <!-- Right Hardware Progress Deck -->
    <aside id="right-panel" class="right-panel"></aside>
  </div>

  <!-- Modal Container -->
  <div id="modal-root"></div>

  <!-- App JS -->
  <script type="module" src="/app.js"></script>
</body>
</html>
